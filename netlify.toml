# Déploiement du frontend Next.js sur Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# IMPORTANT : Dans Netlify (Site configuration > Build & deploy > Build settings),
# laisse le champ "Publish directory" VIDE. Ne mets pas "frontend".

[build]
  base = "frontend"
  command = "npm run build"
  # Doit être différent de base pour que le plugin Next.js accepte (sinon erreur "publish cannot be the same as base")
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
