# Déploiement du frontend Next.js sur Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# IMPORTANT : Dans Netlify (Site configuration > Build & deploy > Build settings),
# laisse le champ "Publish directory" VIDE. Ne mets pas "frontend".

[build]
  base = "frontend"
  command = "npm run build"
  # Ne pas définir publish : le plugin Next.js gère le déploiement

[[plugins]]
  package = "@netlify/plugin-nextjs"
