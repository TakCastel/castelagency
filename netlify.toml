# Déploiement du frontend Next.js sur Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# IMPORTANT : Dans Netlify (Site configuration > Build & deploy > Build settings),
# laisse le champ "Publish directory" VIDE. Ne mets pas "frontend".

[build]
  base = "frontend"
  command = "npm run build"
  # Doit être différent de base pour que le plugin Next.js accepte (sinon erreur "publish cannot be the same as base")
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache navigateur des images : sans ça Netlify renvoie max-age=0 et chaque visite
# re-télécharge / revalide toutes les images. Fichiers non hashés : 1 jour frais,
# puis resservis tout de suite pendant qu'ils se revalident en arrière-plan (7 jours).
[[headers]]
  for = "/_next/image"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
